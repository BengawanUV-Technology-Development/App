services:
  backend:
    build:
      context: ./src-tauri/src-py
      dockerfile: Dockerfile
    container_name: buv_backend
    ports:
      - "5001:5001"
      - "5000:5000/udp"
      - "5005:5005/udp"
      - "14551:14551/udp"
    env_file:
      - ./src-tauri/src-py/.env
    volumes:
      - ./recordings:/app/recordings
    restart: unless-stopped
